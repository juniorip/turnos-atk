<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso local · Turnos ATK</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#061121;color:#eef5ff;font:16px/1.5 system-ui,sans-serif}main{width:100%;max-width:430px;padding:30px;border:1px solid #284764;border-radius:20px;background:#0d2037}img{display:block;width:180px;margin:0 auto 24px}h1{font-size:26px;margin:0 0 8px}p{color:#abc0d8}label{display:block;margin:18px 0 6px;font-weight:600}input,button{width:100%;min-height:46px;border-radius:10px;font:inherit}input{padding:10px 12px;border:1px solid #385575;background:#07182a;color:#fff}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #80baff;outline-offset:3px}button{margin-top:24px;border:0;background:#3c95f7;color:#061121;font-weight:750;cursor:pointer}button:disabled{opacity:.65;cursor:wait}#status{min-height:24px;color:#ffbab3;margin:12px 0 0}a{color:#8ec6ff}small{display:block;margin-top:20px;color:#abc0d8}
  </style>
</head>
<body>
  <main>
    <img src="./atk-peru-wk.png" alt="ATK Altoque Perú WK">
    <h1>Acceso local de prueba</h1>
    <p>Inicia sesión para atender los tickets de la base demo.</p>
    <form id="login-form">
      <label for="username">Usuario</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">Entrar a Turnos</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <small><a href="./buscar-cliente.html">Abrir buscador de Pancake</a></small>
  </main>
  <script>
    const form=document.getElementById('login-form'),button=document.getElementById('submit'),status=document.getElementById('status');
    form.addEventListener('submit',async(event)=>{
      event.preventDefault();button.disabled=true;status.textContent='Validando acceso…';
      try{
        const fields=new FormData(form);
        const response=await fetch(new URL('api/auth/login',location.href),{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:fields.get('username'),password:fields.get('password')}),cache:'no-store'});
        const data=await response.json();
        if(!response.ok)throw new Error(data.error||'No se pudo iniciar sesión.');
        sessionStorage.setItem('turnos_atk_tab_authenticated','1');
        location.replace(new URL('./',location.href));
      }catch(error){status.textContent=error instanceof Error?error.message:'No se pudo conectar con el servidor local.';button.disabled=false;}
    });
  </script>
</body>
</html>
